services:
  classify:
    build: ./sidecar
    container_name: splastic-classify
    environment:
      ELASTIC_HOST: "${ELASTIC_HOST:?ELASTIC_HOST is required}"
      ELASTIC_API_KEY: "${ELASTIC_API_KEY:?ELASTIC_API_KEY is required}"
      DATA_STREAM_NAMESPACE: "${DATA_STREAM_NAMESPACE:-default}"
      UVICORN_WORKERS: "${UVICORN_WORKERS:-1}"
      ELASTIC_HTTP_TIMEOUT_S: "${ELASTIC_HTTP_TIMEOUT_S:-2.0}"
      ELASTIC_ENSURE_CONCURRENCY: "${ELASTIC_ENSURE_CONCURRENCY:-8}"
      CLASSIFY_AUTH_TOKEN: "${CLASSIFY_AUTH_TOKEN:-splastic-dev-classify-token}"
    expose:
      - "8080"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health')"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s

  # Cooked S2S :39998 + uncooked TCP :39997 → in-process classify → ES _bulk
  s2s-decode:
    build: ./packages/splastic-writer
    container_name: splastic-s2s-decode
    ports:
      - "${INGEST_BIND:-127.0.0.1}:39998:39998"
      - "${INGEST_BIND:-127.0.0.1}:39997:39997"
    expose:
      - "8081"
    environment:
      S2S_LISTEN_HOST: "0.0.0.0"
      S2S_LISTEN_PORT: "39998"
      UNCOOKED_LISTEN_HOST: "0.0.0.0"
      UNCOOKED_LISTEN_PORT: "39997"
      S2S_HEALTH_PORT: "8081"
      ELASTIC_HOST: "${ELASTIC_HOST:?ELASTIC_HOST is required}"
      ELASTIC_API_KEY: "${ELASTIC_API_KEY:?ELASTIC_API_KEY is required}"
      CLASSIFY_URL: "http://classify:8080"
      CLASSIFY_AUTH_TOKEN: "${CLASSIFY_AUTH_TOKEN:-splastic-dev-classify-token}"
      DATA_STREAM_NAMESPACE: "${DATA_STREAM_NAMESPACE:-default}"
      S2S_UPSTREAM_QUEUE_SIZE: "${S2S_UPSTREAM_QUEUE_SIZE:-10000}"
      S2S_UPSTREAM_BATCH_SIZE: "${S2S_UPSTREAM_BATCH_SIZE:-1000}"
      S2S_UPSTREAM_FLUSH_MS: "${S2S_UPSTREAM_FLUSH_MS:-25}"
      WRITER_BULK_WORKERS: "${WRITER_BULK_WORKERS:-16}"
      WRITER_PROCESSES: "${WRITER_PROCESSES:-4}"
      S2S_UPSTREAM_DRAIN_TIMEOUT_S: "${S2S_UPSTREAM_DRAIN_TIMEOUT_S:-30}"
      S2S_MAX_CONNECTIONS: "${S2S_MAX_CONNECTIONS:-256}"
      S2S_MAX_SESSION_BUFFER_BYTES: "${S2S_MAX_SESSION_BUFFER_BYTES:-33554432}"
      WRITER_SPILL_DIR: "${WRITER_SPILL_DIR:-/var/lib/splastic/spill}"
      SPLASTIC_SHARD_ID: "${SPLASTIC_SHARD_ID:-0}"
      LOG_LEVEL: "INFO"
    volumes:
      - writer_spill:/var/lib/splastic/spill
    depends_on:
      classify:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8081/health')"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s

  index-lag-probe:
    build: ./deploy/index_lag_probe
    container_name: splastic-index-lag-probe
    profiles: ["metrics"]
    environment:
      ELASTIC_HOST: "${ELASTIC_HOST:?ELASTIC_HOST is required}"
      ELASTIC_API_KEY: "${ELASTIC_API_KEY:?ELASTIC_API_KEY is required}"
      DATA_STREAM_NAMESPACE: "${DATA_STREAM_NAMESPACE:-default}"
      S2S_HEALTH_URLS: "http://s2s-decode:8081/health"
      INTERVAL_SECONDS: "${INDEX_LAG_INTERVAL_SECONDS:-15}"
      LISTEN_PORT: "9103"
    ports:
      - "${INGEST_BIND:-127.0.0.1}:${INDEX_LAG_HOST_PORT:-9103}:9103"
    depends_on:
      - s2s-decode
    restart: unless-stopped

  prometheus:
    build: ./deploy/prometheus
    container_name: splastic-prometheus
    profiles: ["metrics"]
    environment:
      ELASTIC_HOST: "${ELASTIC_HOST:?ELASTIC_HOST is required}"
      ELASTIC_API_KEY: "${ELASTIC_API_KEY:-}"
      PROMETHEUS_ELASTIC_API_KEY: "${PROMETHEUS_ELASTIC_API_KEY:-}"
      PROMETHEUS_REMOTE_WRITE_URL: "${PROMETHEUS_REMOTE_WRITE_URL:-}"
      SPLASTIC_SHARD_ID: "${SPLASTIC_SHARD_ID:-0}"
    ports:
      - "${INGEST_BIND:-127.0.0.1}:${PROMETHEUS_HOST_PORT:-9090}:9090"
    volumes:
      - ./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml.tmpl:ro
      - ./deploy/alerts/splastic-alerts.yaml:/etc/prometheus/rules/splastic-alerts.yaml:ro
      - ./deploy/alerts/splastic-recording.yaml:/etc/prometheus/rules/splastic-recording.yaml:ro
      - prometheus_data:/prometheus
    depends_on:
      - s2s-decode
      - classify
      - index-lag-probe
    restart: unless-stopped

volumes:
  writer_spill:
  prometheus_data:
