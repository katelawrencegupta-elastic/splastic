# Prometheus / Alertmanager rules for Splastic
#
# Load with PrometheusRule (kube-prometheus) or as a classic rules file.
# Also load deploy/alerts/splastic-recording.yaml for derived series.
# Metric names match /metrics on writer/s2s-decode (:8081), classify (:8080),
# and index_lag_probe (:9103).

groups:
  - name: splastic
    rules:
      - alert: SplasticS2SQueuePegged
        expr: splastic_s2s_upstream_queue > 9000
        for: 2m
        labels:
          severity: critical
          service: splastic
        annotations:
          summary: "Splastic writer bulk queue pegged"
          description: >-
            upstream_queue={{ $value }} on {{ $labels.instance }}.
            Writer/ES is behind; Splunk will back-pressure. See docs/runbooks/alerting.md.

      - alert: SplasticClassifyNotReady
        expr: splastic_classify_ready == 0
        for: 2m
        labels:
          severity: critical
          service: splastic
        annotations:
          summary: "Splastic classify not ready"
          description: >-
            classify_ready=0 on {{ $labels.instance }}.
            Index template ensure failed; check ES credentials/network and classify logs.

      - alert: SplasticWriterBulkFailures
        expr: increase(splastic_writer_indexed_fail_total[15m]) > 0
        for: 15m
        labels:
          severity: warning
          service: splastic
        annotations:
          summary: "Splastic writer ES bulk failures"
          description: >-
            indexed_fail increased over 15m on {{ $labels.instance }}.
            Check spill dir / ES ingest capacity; see docs/runbooks/alerting.md.

      - alert: SplasticIndexLagHigh
        expr: splastic_index_lag_seconds > 60
        for: 10m
        labels:
          severity: warning
          service: splastic
        annotations:
          summary: "Splastic index lag high"
          description: >-
            Index lag {{ $value }}s on {{ $labels.instance }}.
            See docs/runbooks/alerting.md (index lag probe).

      - alert: SplasticPeakToAvgHigh
        expr: splastic:peak_to_avg:1d > 3
        for: 1h
        labels:
          severity: warning
          service: splastic
        annotations:
          summary: "Splastic ingest peak/avg ratio high"
          description: >-
            peak_to_avg={{ $value }} over 1d. Daily-total sizing understates need;
            re-run shards ≈ ceil(ceil(peak_GBps/0.008)×1.25) on measured peak.
            See docs/runbooks/sharding.md.

      - alert: SplasticClassifyMissStorm
        expr: >
          (
            splastic:miss_fraction:1m > 0.25
            or splastic:classify_miss_eps:1m > 2000
          )
          and splastic:ingest_eps:1m > 100
        for: 5m
        labels:
          severity: warning
          service: splastic
        annotations:
          summary: "Splastic classify metadata-miss storm"
          description: >-
            miss_fraction or miss_eps elevated on {{ $labels.instance }}.
            Expand classify_rules.json and check UF sourcetype/source.
            See docs/runbooks/alerting.md.
