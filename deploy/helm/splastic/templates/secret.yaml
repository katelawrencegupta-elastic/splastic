{{- if not .Values.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "splastic.secretName" . }}
  labels:
    {{- include "splastic.labels" . | nindent 4 }}
type: Opaque
stringData:
  elastic-api-key: {{ required "elastic.apiKey is required (or set existingSecret)" .Values.elastic.apiKey | quote }}
  classify-auth-token: {{ required "classify.authToken is required (or set existingSecret)" .Values.classify.authToken | quote }}
{{- end }}
